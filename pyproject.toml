[project]
name = "agent-onboarding"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kzizic", email = "karlo.zizic1@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "mcp==2.3.0",
    "pydantic==2.14.1",
    "rfc8785==0.1.4",
    "uvicorn==0.54.0",
]

[project.scripts]
agent-onboarding = "agent_onboarding:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
